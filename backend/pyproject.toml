[project]
name = "sighttest-backend"
version = "0.1.0"
description = "Web 端智能测试系统后端（FastAPI + Celery）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "redis>=6.1,<7.0",
    "celery[redis]>=5.4,<6.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "cryptography>=43,<46",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "minio>=7.2,<8.0",
    "aiosmtplib>=3.0,<4.0",
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "playwright>=1.48,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# celery 的 @task 装饰器缺少完整类型标注（第三方库问题）
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
