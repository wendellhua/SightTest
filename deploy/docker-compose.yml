# 一期 Windows 本地部署：依赖中间件以容器方式运行（Docker Desktop / WSL2）
services:
  postgres:
    image: postgres:16
    container_name: sighttest-postgres
    environment:
      POSTGRES_USER: sighttest
      POSTGRES_PASSWORD: sighttest
      POSTGRES_DB: sighttest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sighttest-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: sighttest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbuckets:
    image: minio/mc
    container_name: sighttest-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/sighttest;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: sighttest-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
  miniodata:
